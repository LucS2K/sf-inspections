version: 2

models:
  - name: fct_inspection_timeline
    description: >
      Facility timelines over stg_inspections, umbrella permits excluded.
      Same grain as staging minus umbrella rows. days_since_prev / days_to_next
      are NULL at timeline boundaries (censoring, not absence).
    columns:
      - name: permit_number
        tests: [not_null]
      - name: visit_number
        tests: [not_null]

  - name: fct_enforcement_episodes
    description: >
      One row per failure event with its resolution (next rated visit) and
      durability observation (the rated visit after that). NULL resolution
      or durability fields are censoring, not success or absence.
    columns:
      - name: permit_number
        tests: [not_null]
      - name: failure_rating
        tests:
          - accepted_values:
              arguments:
                  values: ['Conditional Pass', 'Closure']
