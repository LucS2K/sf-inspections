version: 2

models:
  - name: stg_inspections
    description: >
      One row per inspection event at a food facility, 2024-present.
      Grain: (permit_number, inspection_date, inspection_type, event_seq).
      Republished versions are collapsed to the latest data_as_of; real
      same-day multiplicity (umbrella-permit stalls, repeat visits) is
      preserved and numbered by event_seq. inspection_type is NULL for
      roughly the most recent year of data (DPH backfills it with lag),
      so type-dependent analyses must state their coverage window.
    columns:
      - name: permit_number
        tests: [not_null]
      - name: inspection_date
        tests: [not_null]
      - name: facility_rating_status
        tests:
          - accepted_values:
              values: ['Pass', 'Conditional Pass', 'Closure']
      - name: event_seq
        tests: [not_null]

  - name: stg_inspections_2020_2023
    description: >
      Context-only old era, one row per inspection_id (raw is violation
      grain). Covers 2020-03-09 to 2023-08-03 only; there is a five-month
      gap before the new era begins. No permit_number exists; linkage to
      modern facilities is name+address inference. Never feeds outcomes.
    columns:
      - name: inspection_id
        tests: [unique, not_null]
      - name: facility_status
        tests:
          - not_null
          - accepted_values:
              values: ['Pass', 'Conditional Pass', 'Closure']

  - name: stg_yelp
    description: >
      Yelp Fusion snapshot for the failure cohort and a deterministic
      control sample. Name+address matched (inferred linkage). Cohort is
      'failure' or 'control'.
    columns:
      - name: permit_number
        tests: [unique, not_null]
      - name: match_status
        tests:
          - accepted_values:
              values: ['matched', 'no_match']

seeds:
  - name: permit_type_classification
    description: >
      Reviewed classification of every permit_type observed in raw.
      Generated verbatim from the data 2026-08-02 so string matching is
      exact; is_food and is_umbrella flags hand-reviewed. Non-food: tobacco,
      pet facilities, laundries, pools, massage, tattoo. Umbrella: farmers
      markets and community-event vendor permits, where one permit covers
      many stalls and per-facility timelines are meaningless.
    columns:
      - name: permit_type
        tests: [unique, not_null]
