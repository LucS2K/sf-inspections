name: weekly-refresh

on:
  schedule:
    # Monday 16:00 UTC = 09:00 Pacific ish (DPH publishes monthly with lag;
    # weekly catches the drop without hammering the API)
    - cron: "0 16 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
      DBT_TARGET: prod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Incremental ingest (tvy3-wexg)
        run: python ingest/fetch.py --era new

      - name: Build and test models
        working-directory: dbt
        run: dbt build

      - name: Refresh business-registry cross-check
        # keeps the attrition split current: newly unresolved failures get
        # their registry candidates fetched each week (idempotent, small)
        run: python ingest/fetch_registry.py

      - name: Export dashboard data
        run: python site/build_data.py

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: site
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Open an issue if the refresh failed
        # a silent Monday failure would leave the site quietly stale;
        # an issue lands in email so it gets seen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Weekly refresh failed $(date -u +%F)" \
            --body "The weekly refresh did not complete. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
