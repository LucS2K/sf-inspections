name: ci

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Python syntax
        run: python -m compileall -q ingest site scripts

      - name: dbt parse (project + schema validity)
        working-directory: dbt
        run: dbt parse

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Dashboard JS syntax
        run: node --check site/app.js
